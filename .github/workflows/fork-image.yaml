name: fork-image

# Build the patched StackRadar server image from this fork and push it to GHCR.
# Only the server is rebuilt; the client keeps the chart's upstream image.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/legacy-uuid-validation

permissions:
  contents: read
  packages: write

jobs:
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      - name: Install
        working-directory: server
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Legacy id regression test
        working-directory: server
        run: pnpm test:unit -- tests/unit/schemas/legacy-guid.test.ts

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server
        run: |
          set -eux
          docker build \
            -f server/Dockerfile \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            -t ghcr.io/kubedoll-heavy-industries/stackradar-server:0.2.0-p1 \
            server
          docker push ghcr.io/kubedoll-heavy-industries/stackradar-server:0.2.0-p1
